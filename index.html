let L="en";
function set(l){L=l;document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=D[l][e.dataset.t]);
document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
document.title="Tapstar – "+D[l].h1;try{localStorage.setItem('lang',l)}catch(e){}}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>set(b.dataset.l));
let l="";try{l=localStorage.getItem('lang')||''}catch(e){}
if(!D[l]){const n=(navigator.language||'en').slice(0,2);l=D[n]?n:'en'}
set(l);
function tick(){let s=Math.max(0,Math.floor((END-new Date())/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
document.getElementById('cd').textContent=d+"d "+h+"h "+m+"m"}
tick();setInterval(tick,30000);
document.getElementById('f').onsubmit=e=>{e.preventDefault();const f=e.target,
body=`Name: ${f.n.value}\nEmail: ${f.e.value}\nPack: ${f.p.value}\n\n${f.m.value}`;
location.href=`mailto:${EMAIL}?subject=${encodeURIComponent("Tapstar – "+f.p.value)}&body=${encodeURIComponent(body)}`};
</script>
